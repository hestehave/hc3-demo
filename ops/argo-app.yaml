apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vmlab
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: https://github.com/hestehave/hc3-demo.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: vmlab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
  - group: kubevirt.io
    kind: VirtualMachine
    jsonPointers:
    - /spec/instancetype/revisionName
    - /spec/preference/revisionName
