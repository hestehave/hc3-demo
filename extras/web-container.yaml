# Step 4 of the demo: copy this file into manifests/ and push.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-container
  namespace: vmlab
  labels:
    app: shop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
      tier: web
      kind: container
  template:
    metadata:
      labels:
        app: shop
        tier: web
        kind: container
    spec:
      containers:
      - name: web
        image: registry.access.redhat.com/ubi9/python-312:latest
        command: ["/bin/bash", "-c"]
        args:
        - mkdir -p /tmp/www && echo "web-container · CONTAINER" > /tmp/www/index.html && exec python3 -m http.server 8080 --directory /tmp/www
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: {port: 8080, path: /}
          periodSeconds: 5
