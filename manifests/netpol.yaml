apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: vmlab
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# The ingress router. On bare metal it runs on the host network, so both groups are allowed.
# Second rule: SSH from virt-handler, needed by virtctl ssh (demo step 4).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-to-web
  namespace: vmlab
spec:
  podSelector:
    matchLabels:
      tier: web
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
    ports:
    - protocol: TCP
      port: 8080
  # virtctl ssh / port-forward: the connection comes from virt-handler (openshift-cnv), so allow SSH from there only
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-cnv
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/host-network: ""
    ports:
    - protocol: TCP
      port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-to-db
  namespace: vmlab
spec:
  podSelector:
    matchLabels:
      tier: db
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          tier: web
    ports:
    - protocol: TCP
      port: 5432
