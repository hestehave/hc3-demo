apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: db
  namespace: vmlab
  labels:
    app: shop
    tier: db
spec:
  runStrategy: Always
  instancetype:
    kind: VirtualMachineClusterInstancetype
    name: u1.small
  preference:
    kind: VirtualMachineClusterPreference
    name: fedora
  dataVolumeTemplates:
  - metadata:
      name: db-root
    spec:
      sourceRef:
        kind: DataSource
        name: fedora
        namespace: openshift-virtualization-os-images
      storage:
        resources:
          requests:
            storage: 30Gi
  template:
    metadata:
      labels:
        app: shop
        tier: db
    spec:
      domain:
        devices:
          disks:
          - name: rootdisk
            disk: {bus: virtio}
          - name: cloudinitdisk
            disk: {bus: virtio}
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: rootdisk
        dataVolume:
          name: db-root
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            user: fedora
            password: hc3demo
            chpasswd: {expire: false}
            ssh_authorized_keys:
              - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFbSct1drUZNjS/GBH6u62YKhrIDb1of/Ui/cax5Y4+x hestehave@Mac.localdomain
            write_files:
            - path: /srv/www/index.html
              content: |
                db · VM
            - path: /etc/systemd/system/webdemo.service
              content: |
                [Unit]
                Description=HC3 demo listener
                After=network-online.target
                [Service]
                ExecStart=/usr/bin/python3 -m http.server 5432 --directory /srv/www
                [Install]
                WantedBy=multi-user.target
            runcmd:
            - [systemctl, daemon-reload]
            - [systemctl, enable, --now, webdemo.service]
